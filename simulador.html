<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Crédito</title>
    <link rel="stylesheet" href="simulador.css">
    <script src="funciones.js"></script>
    <script src="simulador.js"></script>
    <script src="utilitarios.js"></script>
</head>
<body>

    <div class="container">
        <h1>Simulador de Crédito</h1>

        <h2>Datos financieros</h2>
        <label for="txtIngresos">Ingresos:</label>
        <input type="text" id="txtIngresos">

        <label for="txtEgresos">Egresos:</label>
        <input type="text" id="txtEgresos">

        <!-- IDs corregidos para coincidir con el script -->
        <p>Disponible: <span id="lblDisponibleValor"></span></p>
        <p>Capacidad de pago mensual: <span id="lblCapacidadValor"></span></p>

        <h2>Solicitud de crédito</h2>
        <label for="txtMonto">Monto:</label>
        <input type="text" id="txtMonto">

        <label for="txtPlazo">Plazo en años:</label>
        <input type="text" id="txtPlazo">

        <label for="txtTasaInteres">Tasa de interés:</label>
        <input type="text" id="txtTasaInteres">

        <p>Interés a pagar: <span id="lblInteresValor"></span></p>
        <p>Total préstamo: <span id="lblTotalValor"></span></p>
        <p>Cuota mensual: <span id="lblCuotaValor"></span></p>
        <p>Estado de crédito: <span id="lblEstadoCredito">ANALIZANDO...</span></p>

        <div class="buttons">
            <!-- Evento onclick agregado aquí -->
            <button type="button" id="btnCalcularCredito" onclick="calcular()">Calcular Crédito</button>
            <button type="button" id="btnReiniciar">Reiniciar</button>
        </div>
    </div>

</body>
</html>
