<!-- ==========================================
     ARCHIVO: index.html (simulador)
     TALLER: Simulador de Crédito
     ==========================================
     Estructura del formulario: 5 campos de entrada (ingresos, egresos,
     monto, plazo, tasa), un botón que calcula y uno que reinicia, y
     varios <span> donde se pintan los resultados. Toda la lógica de
     cálculo vive en funciones.js, y el flujo completo en simulador.js.
     ========================================== -->

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <!-- Hace que la página sea responsiva y se adapte automáticamente a pantallas móviles -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulador de Crédito</title>
        <!-- Enlace a los estilos CSS -->
    <link rel="stylesheet" href="simulador.css">
        <!-- Importación de los archivos JavaScript.
             ORDEN IMPORTANTE: funciones.js y utilitarios.js van PRIMERO
             porque simulador.js usa las funciones que ellos definen
             (calcularDisponible, mostrarTexto, etc.). Si simulador.js
             fuera primero, el navegador daría error "is not defined". -->
    <script src="funciones.js"></script>
    <script src="utilitarios.js"></script>
    <script src="simulador.js"></script>
</head>
<body>

    <!-- Tarjeta contenedora principal centrada -->
    <div class="container">
        <h1>Simulador de Crédito</h1>

        <h2>Datos financieros</h2>

        <!-- Campo: Ingresos
             type="text" (no "number") porque la validación de formato
             la hace a mano el propio simulador.js, con isNaN() -->
        <div class="input-group">
            <label for="txtIngresos">Ingresos ($):</label>
            <input type="text" id="txtIngresos" placeholder="Ej: 1200">
            <!-- Etiqueta pequeña para mostrar el error específico de este campo
                 (queda vacía hasta que simulador.js le escriba un mensaje) -->
            <small class="mensaje-error" id="errIngresos"></small>
        </div>

        <!-- Campo: Egresos -->
        <div class="input-group">
            <label for="txtEgresos">Egresos ($):</label>
            <input type="text" id="txtEgresos" placeholder="Ej: 400">
            <!-- Etiqueta pequeña para el error de egresos -->
            <small class="mensaje-error" id="errEgresos"></small>
        </div>

        <!-- Resultados intermedios: se llenan con mostrarTexto() desde simulador.js -->
        <p>Disponible: <span id="lblDisponibleValor">$0.00</span></p>
        <p>Capacidad de pago mensual: <span id="lblCapacidadValor">$0.00</span></p>

        <h2>Solicitud de crédito</h2>

        <!-- Campo: Monto -->
        <div class="input-group">
            <label for="txtMonto">Monto a solicitar ($):</label>
            <input type="text" id="txtMonto" placeholder="Ej: 5000">
            <!-- Etiqueta pequeña para el error de monto -->
            <small class="mensaje-error" id="errMonto"></small>
        </div>

        <!-- Campo: Plazo -->
        <div class="input-group">
            <label for="txtPlazo">Plazo (años):</label>
            <input type="text" id="txtPlazo" placeholder="Ej: 3">
            <!-- Etiqueta pequeña para el error de plazo -->
            <small class="mensaje-error" id="errPlazo"></small>
        </div>

        <!-- Campo: Tasa de Interés -->
        <div class="input-group">
            <label for="txtTasaInteres">Tasa de interés anual (%):</label>
            <input type="text" id="txtTasaInteres" placeholder="Ej: 12">
            <!-- Etiqueta pequeña para el error de tasa -->
            <small class="mensaje-error" id="errTasaInteres"></small>
        </div>

        <!-- Resultados finales -->
        <p>Interés a pagar: <span id="lblInteresValor">$0.00</span></p>
        <p>Total préstamo: <span id="lblTotalValor">$0.00</span></p>
        <p>Cuota mensual: <span id="lblCuotaValor">$0.00</span></p>
        <p>Estado de crédito: <span id="lblEstadoCredito">POR EVALUAR</span></p>

        <!-- Botones del formulario -->
        <div class="buttons">
            <!-- Al hacer clic ejecuta la función calcular() que valida y procesa -->
            <button type="button" id="btnCalcularCredito" onclick="calcular()">Calcular Crédito</button>
            <!-- Al hacer clic ejecuta la función reiniciarFormulario() que limpia todo -->
            <button type="button" id="btnReiniciar" onclick="reiniciarFormulario()">Reiniciar</button>
        </div>
    </div>

</body>
</html>
